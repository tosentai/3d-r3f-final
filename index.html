<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Celestial Monolith & Floating Sanctuary | Three.js & R3F</title>
    <!-- Швидкий передзавантажувальний кеш для шрифтів -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#05070d] text-white overflow-hidden select-none">
    <div id="root">
      <!-- Миттєвий нативний лоадер до запуску JS -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070d;color:#bae6fd;font-family:sans-serif;gap:14px;z-index:9999;">
        <div style="width:40px;height:40px;border:3px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.75s linear infinite;"></div>
        <div style="font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#7dd3fc;font-weight:500;">
          Завантаження святилища...
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
